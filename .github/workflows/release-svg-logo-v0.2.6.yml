name: Prepare, validate, and release svg-logo v0.2.6

on:
  push:
    branches:
      - agent/add-normalized-logo-variants
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: svg-logo-v0.2.6-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/add-normalized-logo-variants' && startsWith(github.event.head_commit.message, 'Add normalized logo variants release automation')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-normalized-logo-variants
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Register and document normalized variants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')

          const manifestPath = 'icons.json'
          const packagePath = 'package.json'
          const readmePath = 'README.md'
          const brandAssetsPath = 'BRAND_ASSETS.md'

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          const additions = [
            {
              exportName: 'ClaudeCodeMonochrome',
              fileName: 'ClaudeCodeMonochrome',
              slug: 'claude-code-monochrome',
              title: 'Claude Code',
              source: 'Monochrome UI variant derived from Anthropic press kit — Claude Spark (Clay)',
              sourceUrl: 'https://www.anthropic.com/news',
              guidelinesUrl: null,
              assetLicense: 'trademark',
              colorMode: 'monochrome',
              variant: 'logomark'
            },
            {
              exportName: 'OpenCodeMonochrome',
              fileName: 'OpenCodeMonochrome',
              slug: 'opencode-monochrome',
              title: 'OpenCode',
              source: 'Monochrome UI variant derived from OpenCode official favicon geometry',
              sourceUrl: 'https://github.com/anomalyco/opencode/blob/1c965451b537e1af4bff12c163200f762a6a0364/packages/web/public/favicon-v3.svg',
              guidelinesUrl: null,
              assetLicense: 'trademark',
              colorMode: 'monochrome',
              variant: 'logomark'
            },
            {
              exportName: 'XAISquareTransparent',
              fileName: 'XAISquareTransparent',
              slug: 'xai-square-transparent',
              title: 'xAI',
              source: 'Transparent-background UI variant derived from xAI/SpaceXAI media kit — symbol, black, squared',
              sourceUrl: 'https://x.ai/legal/brand-guidelines',
              guidelinesUrl: 'https://x.ai/legal/brand-guidelines',
              assetLicense: 'trademark',
              colorMode: 'fixed-color',
              variant: 'logomark'
            }
          ]

          for (const addition of additions) {
            if (manifest.icons.some((icon) =>
              icon.exportName === addition.exportName ||
              icon.fileName === addition.fileName ||
              icon.slug === addition.slug
            )) {
              throw new Error(`${addition.exportName} is already registered in icons.json`)
            }
            manifest.icons.push(addition)
          }
          manifest.icons.sort((left, right) =>
            left.exportName.localeCompare(right.exportName, 'en', { sensitivity: 'base' })
          )
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)

          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          if (packageJson.scripts.check !== 'node scripts/check-package.js') {
            throw new Error(`Unexpected check script: ${packageJson.scripts.check}`)
          }
          packageJson.scripts.check = 'node scripts/check-package.js && node scripts/check-variants.js'
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)

          let readme = fs.readFileSync(readmePath, 'utf8')
          const importBefore = "import { Anthropic, ClaudeCode, GitHubCopilot, OpenCode, XAI } from '@techbykyle/svg-logo'"
          const importAfter = "import { Anthropic, ClaudeCode, ClaudeCodeMonochrome, GitHubCopilot, OpenCode, OpenCodeMonochrome, XAI, XAISquareTransparent } from '@techbykyle/svg-logo'"
          if (!readme.includes(importBefore)) {
            throw new Error('README named-import example was not found')
          }
          readme = readme.replace(importBefore, importAfter)

          const colorsBefore = "`Anthropic` and `GitHubCopilot` are monochrome and inherit `currentColor`. `ClaudeCode` retains Anthropic's official Clay fill, and `OpenCode` retains the fixed colors from its official app icon. `XAI` preserves the official black-on-white squared treatment and is not recolorable through the root `fill` or `color` props."
          const colorsAfter = "`Anthropic`, `ClaudeCodeMonochrome`, `GitHubCopilot`, and `OpenCodeMonochrome` are monochrome and inherit `currentColor`. `ClaudeCode` retains Anthropic's official Clay fill, while `OpenCode` retains the fixed colors from its official app icon. `XAI` preserves the official black-on-white squared treatment. `XAISquareTransparent` keeps the official black symbol and clipping geometry while omitting only the visible white square background; both xAI exports remain fixed-color."
          if (!readme.includes(colorsBefore)) {
            throw new Error('README color guidance was not found')
          }
          readme = readme.replace(colorsBefore, colorsAfter)

          const claudeRow = '| `ClaudeCode` | `claude-code` | logomark | fixed-color | trademark |'
          const claudeRows = `${claudeRow}\n| \`ClaudeCodeMonochrome\` | \`claude-code-monochrome\` | logomark | monochrome | trademark |`
          if (!readme.includes(claudeRow)) {
            throw new Error('README ClaudeCode catalog row was not found')
          }
          readme = readme.replace(claudeRow, claudeRows)

          const openCodeRow = '| `OpenCode` | `opencode` | logomark | fixed-color | trademark |'
          const openCodeRows = `${openCodeRow}\n| \`OpenCodeMonochrome\` | \`opencode-monochrome\` | logomark | monochrome | trademark |`
          if (!readme.includes(openCodeRow)) {
            throw new Error('README OpenCode catalog row was not found')
          }
          readme = readme.replace(openCodeRow, openCodeRows)

          const xaiRow = '| `XAI` | `xai` | logomark | fixed-color | trademark |'
          const xaiRows = `${xaiRow}\n| \`XAISquareTransparent\` | \`xai-square-transparent\` | logomark | fixed-color | trademark |`
          if (!readme.includes(xaiRow)) {
            throw new Error('README XAI catalog row was not found')
          }
          readme = readme.replace(xaiRow, xaiRows)

          const claudeNote = "`ClaudeCode` uses Anthropic's official Claude Spark (Clay) press-kit asset as the Claude Code product identifier; it is not a separate Claude Code wordmark."
          const normalizedNotes = `${claudeNote}\n\n\`ClaudeCodeMonochrome\` preserves the same Claude Spark view box and path geometry while inheriting \`currentColor\` for uniform provider-icon systems.\n\n\`OpenCodeMonochrome\` preserves the two official OpenCode logo paths, removes the fixed background rectangle, and lets both paths inherit \`currentColor\`.`
          if (!readme.includes(claudeNote)) {
            throw new Error('README ClaudeCode note was not found')
          }
          readme = readme.replace(claudeNote, normalizedNotes)

          const xaiNote = '`XAI` uses the official squared black-on-white media-kit asset exactly as provided. Do not recolor it, remove its white background, or otherwise alter it; consult the linked xAI brand guidelines before use.'
          const xaiNotes = '`XAI` preserves the official squared black-on-white media-kit asset exactly as provided. `XAISquareTransparent` is a package-provided UI variant that preserves the same 600×600 view box, clipping boundary, and black symbol paths while omitting only the visible white background rectangle. Neither xAI export inherits `currentColor`.'
          if (!readme.includes(xaiNote)) {
            throw new Error('README xAI note was not found')
          }
          readme = readme.replace(xaiNote, xaiNotes)
          fs.writeFileSync(readmePath, readme)

          let brandAssets = fs.readFileSync(brandAssetsPath, 'utf8')
          const insertionPoint = '## Newly added in 0.2.5'
          const newSection = `## Newly added in 0.2.6\n\n| Export | Source basis | Treatment | Classification |\n| --- | --- | --- | --- |\n| \`ClaudeCodeMonochrome\` | Anthropic press kit, \`Claude Spark - Clay.svg\` | Official 94×94 view box and path geometry retained; the Clay fill is omitted so the path inherits \`currentColor\`. | \`trademark\` |\n| \`OpenCodeMonochrome\` | OpenCode official repository, \`favicon-v3.svg\` | Official two-path logo geometry retained; the fixed background rectangle and explicit path fills are omitted so both paths inherit \`currentColor\`. | \`trademark\` |\n| \`XAISquareTransparent\` | xAI/SpaceXAI media kit, \`spacexai - symbol - black - squared.svg\` | Official 600×600 view box, clipping boundary, and black paths retained; only the visible white background rectangle is omitted. | \`trademark\` |\n\nThe existing \`ClaudeCode\`, \`OpenCode\`, and \`XAI\` exports remain unchanged as the official-color assets. The new exports are package-provided UI variants for uniform icon systems; they are not additional official brand-kit files.\n\n`
          if (!brandAssets.includes(insertionPoint)) {
            throw new Error('BRAND_ASSETS 0.2.5 heading was not found')
          }
          brandAssets = brandAssets.replace(insertionPoint, `${newSection}${insertionPoint}`)
          fs.writeFileSync(brandAssetsPath, brandAssets)
          NODE

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Test package
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Commit prepared variants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons.json package.json README.md BRAND_ASSETS.md
          git diff --cached --check
          git commit -m "Prepare normalized logo variants"
          git push origin HEAD:agent/add-normalized-logo-variants

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Test package
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Add normalized logo variants')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.2.5"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.5"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.2.5"
          if git rev-parse -q --verify refs/tags/v0.2.6 >/dev/null; then
            echo "v0.2.6 already exists" >&2
            exit 1
          fi
          if npm view @techbykyle/svg-logo@0.2.6 version --json >/dev/null 2>&1; then
            echo "@techbykyle/svg-logo@0.2.6 is already published" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))

          packageJson.version = '0.2.6'
          packageLock.version = '0.2.6'
          packageLock.packages[''].version = '0.2.6'

          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)
          fs.writeFileSync('package-lock.json', `${JSON.stringify(packageLock, null, 2)}\n`)
          NODE

      - name: Test release candidate
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Commit and tag release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-svg-logo-v0.2.6.yml
          git add package.json package-lock.json
          git commit -m "Release svg-logo v0.2.6"
          git tag -a v0.2.6 -m "v0.2.6"
          git push --atomic origin HEAD:main refs/tags/v0.2.6
